        <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

  <!-- FULL-SCREEN NAV OVERLAY -->
  <div id="navOverlay" class="nav-overlay flex flex-col justify-between px-6 sm:px-10 py-24">

  <main>
    <section class="hero-mesh min-h-screen flex flex-col items-center justify-center px-6 text-center">
      <p class="reveal text-xs font-semibold uppercase tracking-[0.3em] text-accent mb-5">404</p>
      <h1 class="reveal font-heading font-extrabold uppercase tracking-tight text-primary leading-[0.95] text-[clamp(2.5rem,10vw,6rem)]" style="animation-delay:60ms">
        This page<br />doesn't exist
      </h1>
      <p class="reveal mt-6 max-w-md mx-auto text-secondary leading-relaxed" style="animation-delay:120ms">
        The link you followed might be broken, or the page may have moved. Let's get you back on track.
      </p>

      <div class="reveal mt-9 flex flex-wrap items-center justify-center gap-4" style="animation-delay:180ms">
        <a href="/"
           class="inline-flex items-center gap-2 rounded-full bg-accent px-7 py-3.5 text-sm font-semibold text-white shadow-card hover:bg-accentDark hover:shadow-cardHover hover:scale-[1.03] transition-all">
          Back to Home
        </a>
        <a href="/blog/"
           class="inline-flex items-center gap-2 rounded-full border border-border px-7 py-3.5 text-sm font-semibold text-primary hover:border-accent transition-all">
          Read the Blog
        </a>
      </div>
    </section>
  </main>

  <footer class="max-w-[1200px] mx-auto px-6 sm:px-10 pb-10">
    <p class="text-center text-xs text-secondary">© <span id="year"></span> Godwin Ubani. All rights reserved.</p>
  </footer>

  <script>
    document.documentElement.classList.remove('no-js');
    document.getElementById('year').textContent = new Date().getFullYear();

    const menuBtn = document.getElementById('menuBtn');
    const navOverlay = document.getElementById('navOverlay');
    menuBtn.addEventListener('click', () => {
      const isOpen = navOverlay.classList.toggle('open');
      menuBtn.classList.toggle('is-open', isOpen);
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });
    navOverlay.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      navOverlay.classList.remove('open');
      menuBtn.classList.remove('is-open');
      menuBtn.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }));

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('reveal-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
  </script>
