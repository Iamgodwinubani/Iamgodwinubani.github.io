<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Godwin Ubani</title>
  <meta name="description" content="This page doesn't exist on Godwin Ubani's site. Head back to the homepage, blog, or about page." />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <meta name="theme-color" content="#2563EB" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body class="font-sans text-primary antialiased">

  <header class="fixed top-0 inset-x-0 z-50 border-b border-border/70 bg-white/70 backdrop-blur-xl">
    <nav class="max-w-[1000px] mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="font-heading font-bold text-lg text-primary tracking-tight">Godwin Ubani</a>
      <div class="hidden sm:flex items-center gap-8">
        <a href="/about/" class="text-sm font-medium text-secondary hover:text-primary transition-colors">About Me</a>
        <a href="/blog/" class="text-sm font-medium text-secondary hover:text-primary transition-colors">Blog</a>
        <a href="/#contact" class="inline-flex items-center rounded-full bg-accent px-4 py-2 text-sm font-semibold text-white shadow-card hover:bg-accentDark hover:shadow-cardHover hover:scale-[1.03] transition-all">Contact</a>
      </div>
    </nav>
  </header>

  <main class="pt-16">
    <section class="max-w-[1000px] mx-auto px-6 pt-28 sm:pt-36 pb-28 sm:pb-36 text-center">
      <p class="reveal text-xs font-semibold uppercase tracking-widest text-accent mb-4">404</p>
      <h1 class="reveal font-heading font-extrabold tracking-tight text-primary text-4xl sm:text-5xl" style="animation-delay:60ms">
        This page doesn't exist
      </h1>
      <p class="reveal mt-5 max-w-md mx-auto text-secondary leading-relaxed" style="animation-delay:120ms">
        The link you followed might be broken, or the page may have moved. Let's get you back on track.
      </p>

      <div class="reveal mt-9 flex flex-wrap items-center justify-center gap-4" style="animation-delay:180ms">
        <a href="/"
           class="inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-sm font-semibold text-white shadow-card hover:bg-accentDark hover:shadow-cardHover hover:scale-[1.03] transition-all">
          Back to Home
        </a>
        <a href="/blog/"
           class="inline-flex items-center gap-2 rounded-full border border-border bg-white px-6 py-3 text-sm font-semibold text-primary hover:border-primary hover:scale-[1.03] transition-all">
          Read the Blog
        </a>
      </div>
    </section>
  </main>

  <footer class="max-w-[1000px] mx-auto px-6 pb-10">
    <p class="text-center text-xs text-secondary">© <span id="year"></span> Godwin Ubani. All rights reserved.</p>
  </footer>

  <script>
    document.documentElement.classList.remove('no-js');
    document.getElementById('year').textContent = new Date().getFullYear();

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('reveal-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
  </script>

</body>
</html>
